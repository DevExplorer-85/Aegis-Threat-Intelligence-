version: '3.8'

services:
  mongo-node1:
    image: mongo:7.0
    container_name: mongo-node1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27021:27017"
    volumes:
      - mongo_node1_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-replica-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-node2:
    image: mongo:7.0
    container_name: mongo-node2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27022:27017"
    volumes:
      - mongo_node2_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-replica-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-node3:
    image: mongo:7.0
    container_name: mongo-node3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27023:27017"
    volumes:
      - mongo_node3_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - mongo-replica-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Activity 13.1 (Try It Yourself): Prometheus Exporter Sidecar
  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    container_name: mongo-prom-exporter
    environment:
      - MONGODB_URI=mongodb://admin:password123@mongo-node1:27017/admin?authSource=admin
    ports:
      - "9216:9216"
    networks:
      - mongo-replica-net
    depends_on:
      - mongo-node1

  mongo-init:
    image: mongo:7.0
    container_name: mongo-init-replica
    networks:
      - mongo-replica-net
    depends_on:
      mongo-node1:
        condition: service_healthy
      mongo-node2:
        condition: service_healthy
      mongo-node3:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - "bash"
      - "-c"
      - |
        mongosh --host mongo-node1:27017 -u admin -p password123 --authenticationDatabase admin --eval "
          try {
            rs.status();
            print('Replica set already initialized.');
          } catch(e) {
            print('Initializing 3-node replica set rs0...');
            rs.initiate({
              _id: 'rs0',
              members: [
                { _id: 0, host: 'mongo-node1:27017', priority: 2 },
                { _id: 1, host: 'mongo-node2:27017', priority: 1 },
                { _id: 2, host: 'mongo-node3:27017', priority: 1 }
              ]
            });
          }
        "

volumes:
  mongo_node1_data:
  mongo_node2_data:
  mongo_node3_data:

networks:
  mongo-replica-net:
    driver: bridge
